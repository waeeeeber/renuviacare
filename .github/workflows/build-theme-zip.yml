name: Build Shopify Theme ZIP

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build theme.zip
        run: |
          mkdir -p dist
          zip -r dist/renuvia-care-theme.zip \
            assets \
            config \
            layout \
            locales \
            sections \
            snippets \
            templates \
            -x "*.DS_Store" "*.gitkeep"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: renuvia-care-theme
          path: dist/renuvia-care-theme.zip
          retention-days: 90
